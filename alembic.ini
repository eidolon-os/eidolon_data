[alembic]
script_location = eidolon_data/db/migrations
prepend_sys_path = .
path_separator = os

# Runtime code sets this from eidolon_data.settings in migrations/env.py.
sqlalchemy.url = sqlite+aiosqlite:///~/eidolon/data/eidolon-system.sqlite3

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
