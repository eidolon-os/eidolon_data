data:
  # Local-first sovereign data store. Override with EIDOLON_DATA_SQLITE_PATH
  # in config/.env for machine-specific locations.
  sqlite_path: "$EIDOLON_STATE_ROOT/eidolon-system.sqlite3"
  # Normalized sensitive media only; use an encrypted volume in production.
  object_store_path: "$EIDOLON_STATE_ROOT/objects"
  echo_sql: false
  # Automatic maturity promotion is opt-in. Supply a versioned, model-bound
  # CandidatePromotionPolicy only after the trial thresholds are evaluated.
  # Promotion never enables a candidate's retained Memory Realm.
  candidate_promotion: null
  # Candidate pool retention v1: seven days from creation/accepted evidence.
  # Expiry excludes matching and retains identity, evidence and memory data.
  candidate_pool_ttl_s: 604800
