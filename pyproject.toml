[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-data"
version = "0.1.0"
description = "Eidolon low-frequency sovereign system-data authority"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    # ``[audit]`` is not optional for this authority. It writes governance facts
    # to ``audit_outbox`` and runs the dispatcher that publishes them, so the
    # SDK's NATS publisher is a runtime dependency here, not an extra a Host may
    # skip. Declared plain, it resolved without ``nats-py`` and every publish
    # raised ``install eidolon-sdk[audit]`` into a column nobody reads — 5336
    # retries over six days, no log line, health still 200.
    "eidolon-sdk[audit]",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
eidolon-data = "eidolon_data.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.32",
]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
eidolon-sdk = { path = "../eidolon_sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["eidolon_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure logic tests without a database or process boundary",
    "component: System Data behavior against an isolated SQLite database",
    "integration: migration, SDK, read-only, or ASGI contract integration",
    "e2e: real authority process exercised over HTTP",
]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["eidolon_data"]
omit = ["*/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
